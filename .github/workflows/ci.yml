name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten
        run: pip install -r requirements_test.txt
      - name: Tests
        run: python -m pytest -q
      - name: Installationspaket bauen
        run: ./package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hmrest-install
          path: dist/*.zip

  validate:
    # Offizielle Prüfungen: HACS-Anforderungen und hassfest (Manifest, services.yaml, Übersetzungen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS-Prüfung
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands description topics
      - name: hassfest
        uses: home-assistant/actions/hassfest@master

  release:
    # Nur auf main und nur wenn Tests und Prüfungen grün sind. Legt v<version> an, falls es das Release noch nicht gibt.
    needs: [test, validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hmrest-install
          path: dist
      - name: Version ermitteln
        id: v
        run: echo "version=$(python3 -c "import json;print(json.load(open('custom_components/hmrest/manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - name: Release anlegen (nur bei neuer Version)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V existiert bereits – nichts zu tun."; exit 0
          fi
          awk -v v="$V" '/^## /{p=($2==v); next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "HomeMatic (HM-REST) $V" > notes.md
          cat >> notes.md <<'TXT'

          ### Installation
          `hmrest-install-*.zip` herunterladen, im Home-Assistant-Config-Ordner entpacken (es entsteht
          `custom_components/hmrest`) und Home Assistant neu starten.
          TXT
          gh release create "v$V" dist/*.zip --title "HomeMatic (HM-REST) $V" --notes-file notes.md --target "$GITHUB_SHA"
